<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap&family=Faster+One&family=Chewy"
      rel="stylesheet"
    />
    <style>
      /* ===== ブランド設定：ここだけ変えれば見た目が変わる ===== */
      :root {
        --accent: #0abab5;      /* アクセント色（CLOSED・区切り）ティファニーブルー */
        --ink: #ffffff;         /* メインの文字色（数値・時間） */
        --muted: #d4d4d4;       /* ラベルの文字色（日付・NEXT OPEN） */
        --bg: #111111;

        /* 文字サイズは4段階に統一 */
        --fs-label: 30px;       /* ラベル（日付・NEXT OPEN） */
        --fs-mid: 44px;         /* 日付（次の営業日） */
        --fs-lg: 56px;          /* 営業時間 */
        --fs-status: 130px;     /* OPEN / CLOSED */

        --display: "Montserrat", "Noto Sans JP", sans-serif;
        --body: "Noto Sans JP", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        overflow: hidden;
      }

      .bg {
        position: absolute;
        inset: 0;
        background-image: var(--bg-url);
        background-size: cover;
        background-position: center;
      }
      .scrim {
        position: absolute;
        inset: 0;
        /* スマホ用デザイン設定から更新する透過幕 */
        background:
          radial-gradient(ellipse 75% 48% at 50% 50%, rgba(43, 29, 20, 0.27), rgba(43, 29, 20, 0) 72%),
          linear-gradient(180deg, rgba(43, 29, 20, 0.22), rgba(43, 29, 20, 0.13) 40%, rgba(43, 29, 20, 0.34));
      }

      .frame {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6); /* 明るい写真でも読めるように */
      }

      /* ラベル：日付・NEXT OPEN。色とサイズを統一 */
      .today,
      .next-lbl {
        font-size: var(--fs-label);
        color: var(--muted);
        letter-spacing: 4px;
      }
      .next-lbl {
        font-family: var(--display);
        text-transform: uppercase;
        letter-spacing: 6px;
      }
      .today {
        margin-bottom: 30px;
        color: var(--ink);
        font-size: 38px;
      }

      .status {
        font-family: var(--display);
        font-size: var(--fs-status);
        text-transform: uppercase;
        line-height: 1;
        letter-spacing: 2px;
      }
      body.is-closed .status {
        color: var(--accent);
      }

      .rule {
        width: 90px;
        height: 4px;
        background: var(--accent);
        border-radius: 2px;
        margin: 34px auto;
      }

      /* 営業時間（横棒と同じアクセント色） */
      .hours {
        font-family: var(--display);
        font-size: var(--fs-lg);
        color: var(--accent);
        letter-spacing: 3px;
      }
      .hours .sep {
        color: var(--accent);
        padding: 0 12px;
      }
      .hours-suffix {
        margin-left: 14px;
        font-family: var(--body);
        font-size: 0.48em;
        letter-spacing: 2px;
        vertical-align: 0.2em;
      }

      .note {
        margin-top: 26px;
        font-size: 38px;
        color: var(--ink);
      }

      /* 次の営業日：日付＋時間を1行、Next Openラベルと同サイズ */
      .next-info {
        margin-top: 14px;
        font-size: var(--fs-label);
        color: var(--ink);
        letter-spacing: 2px;
      }
      .next-info .sep {
        color: var(--ink);
        padding: 0 8px;
      }

      .only-open,
      .only-closed {
        display: none;
      }
      body.is-open .only-open {
        display: block;
      }
      body.is-closed .only-closed {
        display: block;
      }

      /* cozy-custom-fonts:start */
      :root {
        --font-open: "Faster One", var(--display);
        --font-date: "Chewy", var(--body);
        --font-weekday: "Chewy", var(--body);
        --font-hours: "Chewy", var(--body);
      }
      body.is-open .status {
        font-family: var(--font-open);
        font-weight: 400;
      }
      .today-date {
        font-family: var(--font-date);
        font-weight: 400;
      }
      .today-weekday {
        font-family: var(--font-weekday);
        font-weight: 400;
      }
      .hours,
      .hours-suffix {
        font-family: var(--font-hours);
        font-weight: 400;
      }
      /* cozy-custom-fonts:end */
    </style>
    <!-- schedule.json の theme から色を上書き（設定が無ければ既定色のまま） -->
    <style>{{THEME}}</style>
  </head>
  <body class="{{BODY_CLASS}}" style="{{BODY_STYLE}}">
    <div class="bg"></div>
    <div class="scrim"></div>

    <div class="frame">
      <div class="today"><span class="today-date">{{DATE_LABEL}}</span> <span class="today-weekday">{{WEEKDAY}}</span></div>

      <div class="only-open">
        <div class="status">OPEN</div>
        <div class="hours" style="margin-top: 72px;">{{OPEN}}<span class="sep">–</span>{{CLOSE}}<span class="hours-suffix">{{HOURS_SUFFIX}}</span></div>
        <div class="note only-note">{{NOTE}}</div>
      </div>

      <div class="only-closed">
        <div class="status">CLOSED</div>
        <div class="rule"></div>
        <div class="next-lbl">Next Open</div>
        <div class="next-info">
          {{NEXT_DATE}} {{NEXT_WEEKDAY}} {{NEXT_OPEN}}<span class="sep">–</span>{{NEXT_CLOSE}}
        </div>
        <div class="note note-closed">{{NOTE}}</div>
      </div>
    </div>
  </body>
</html>
