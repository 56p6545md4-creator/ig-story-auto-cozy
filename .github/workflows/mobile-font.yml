name: スマホ用フォント設定
on:
  workflow_dispatch:
    inputs:
      open_font:
        description: 'OPENの書体'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - '日替わり（7書体）'
          - 'Faster One'
          - 'Bungee'
          - 'Righteous'
          - 'Shrikhand'
          - 'Black Ops One'
          - 'Bowlby One SC'
          - 'Rubik Mono One'
          - 'Chewy'
          - 'Oswald'
          - 'Montserrat'
          - 'Noto Sans JP'
          - 'Noto Serif JP'
      date_font:
        description: '日付の書体'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - 'Faster One'
          - 'Chewy'
          - 'Oswald'
          - 'Montserrat'
          - 'Noto Sans JP'
          - 'Noto Serif JP'
      weekday_font:
        description: '曜日の書体'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - 'Faster One'
          - 'Chewy'
          - 'Oswald'
          - 'Montserrat'
          - 'Noto Sans JP'
          - 'Noto Serif JP'
      hours_font:
        description: '営業時間・L.O.の書体'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - 'Faster One'
          - 'Chewy'
          - 'Oswald'
          - 'Montserrat'
          - 'Noto Sans JP'
          - 'Noto Serif JP'
permissions:
  contents: write
concurrency:
  group: cozy-mobile-design-settings
  cancel-in-progress: false
jobs:
  save-font:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and update font
        env:
          FONT_OPEN: ${{ inputs.open_font }}
          FONT_DATE: ${{ inputs.date_font }}
          FONT_WEEKDAY: ${{ inputs.weekday_font }}
          FONT_HOURS: ${{ inputs.hours_font }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          function setFonts(html, selections) {
            const fonts = {
              'Faster One': ['Faster+One', '"Faster One", var(--body)'],
              'Chewy': ['Chewy', '"Chewy", var(--body)'],
              'Oswald': ['Oswald:wght@400;500', '"Oswald", var(--body)'],
              'Montserrat': ['Montserrat:wght@400;500', '"Montserrat", var(--body)'],
              'Noto Sans JP': ['Noto+Sans+JP:wght@400;500', '"Noto Sans JP", sans-serif'],
              'Noto Serif JP': ['Noto+Serif+JP:wght@400;500', '"Noto Serif JP", serif'],
              'Bungee': ['Bungee', '"Bungee", var(--body)'],
              'Righteous': ['Righteous', '"Righteous", var(--body)'],
              'Shrikhand': ['Shrikhand', '"Shrikhand", var(--body)'],
              'Black Ops One': ['Black+Ops+One', '"Black Ops One", var(--body)'],
              'Bowlby One SC': ['Bowlby+One+SC', '"Bowlby One SC", var(--body)'],
              'Rubik Mono One': ['Rubik+Mono+One', '"Rubik Mono One", var(--body)']
            };
            const added = new Map();
            for (const key of ['open', 'date', 'weekday', 'hours']) {
              const choice = selections[key] || '変更しない';
              if (choice === '変更しない') continue;
              if (!Object.hasOwn(fonts, choice)) throw new Error('フォントの選択値が不正です');
              const pattern = new RegExp('--font-' + key + ':\\s*[^;]+;', 'g');
              if ((html.match(pattern) || []).length !== 1) throw new Error('個別フォント設定を特定できません。保存を中止しました');
              const [query, stack] = fonts[choice];
              html = html.replace(pattern, '--font-' + key + ': ' + stack + ';');
              added.set(query.split(':')[0], query);
            }
            if (!added.size) return html;
            const link = /href="https:\/\/fonts\.googleapis\.com\/css2\?([^"]*)"/g;
            if ((html.match(link) || []).length !== 1) throw new Error('フォント読込を特定できません');
            return html.replace(link, (_, query) => {
              const params = query.split('&').filter(p => !p.startsWith('family=') || !added.has(p.slice(7).split(':')[0]));
              for (const value of added.values()) params.push('family=' + value);
              return 'href="https://fonts.googleapis.com/css2?' + params.join('&') + '"';
            });
          }
          const original = await readFile('src/template.html', 'utf8');
          const scheduleOriginal = await readFile('schedule.json', 'utf8');
          const schedule = JSON.parse(scheduleOriginal);
          const dailyFonts = ['Faster One', 'Bungee', 'Righteous', 'Shrikhand', 'Black Ops One', 'Bowlby One SC', 'Rubik Mono One'];
          const openChoice = process.env.FONT_OPEN || '変更しない';
          if (openChoice === '日替わり（7書体）') {
            schedule.openFontRotation = dailyFonts;
          } else if (openChoice !== '変更しない') {
            schedule.openFontRotation = [openChoice];
          }
          const updated = setFonts(original, {
            open: openChoice === '日替わり（7書体）' ? '変更しない' : openChoice,
            date: process.env.FONT_DATE,
            weekday: process.env.FONT_WEEKDAY,
            hours: process.env.FONT_HOURS,
          });
          if (updated !== original) await writeFile('src/template.html', updated);
          const scheduleUpdated = JSON.stringify(schedule, null, 2) + '\n';
          if (scheduleUpdated !== scheduleOriginal) await writeFile('schedule.json', scheduleUpdated);
          JS
      - name: Save font
        run: |
          git add -- src/template.html schedule.json
          if git diff --cached --quiet; then
            echo '変更はありません。現在のフォントを維持しました。' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update story font from mobile settings"
            git push origin HEAD:main
            echo 'フォントを保存しました。次回の画像生成から反映されます。' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Instagramへの即時投稿や投稿済み画像の変更はしていません。' >> "$GITHUB_STEP_SUMMARY"
          echo 'OPENは日替わり7書体または固定書体を選べます。日付・曜日・営業時間も個別に変更でき、選択しない項目は今の設定を維持します。' >> "$GITHUB_STEP_SUMMARY"
          echo '[文字の見え方をプレビューで確認する](https://github.com/56p6545md4-creator/ig-story-auto-cozy/actions/workflows/preview-story.yml)' >> "$GITHUB_STEP_SUMMARY"
