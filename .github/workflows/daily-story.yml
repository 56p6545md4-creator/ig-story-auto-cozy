name: daily-instagram-story

# Primary: external workflow_dispatch at 08:10 Asia/Tokyo; see docs/scheduling.md.
# GitHub schedule remains an independent fallback (delivery may be delayed).
on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  issues: write     # failure notification
  contents: write   # レンダリング画像を published ブランチへ push するため

concurrency:
  group: cozy-instagram-story
  cancel-in-progress: false

jobs:
  post-story:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check daily guard before expensive setup
        id: guard
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          TIME=$(TZ=Asia/Tokyo date +%H%M)
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          # Never publish before the requested morning start.
          if (( 10#$TIME < 810 )); then
            echo "Before 08:10 JST; no post" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin published
          LAST=$(git show origin/published:last_posted.txt)
          if [ "$LAST" = "$TODAY" ]; then
            echo "Already posted $TODAY" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          elif git cat-file -e origin/published:pending_post.txt 2>/dev/null; then
            PENDING=$(git show origin/published:pending_post.txt)
            if [ "$PENDING" = "$TODAY" ]; then
              echo "Publication uncertain: inspect Instagram and pending_post.txt before retry" >&2
              exit 1
            fi
          fi

      - name: Check required secrets before publishing
        if: steps.guard.outputs.skip != 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          test -n "$IG_USER_ID" || { echo "IG_USER_ID is missing"; exit 1; }
          test -n "$IG_ACCESS_TOKEN" || { echo "IG_ACCESS_TOKEN is missing"; exit 1; }

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'yes'
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        if: steps.guard.outputs.skip != 'yes'
        run: |
          command -v ffmpeg # preinstalled on ubuntu-latest; fail visibly if removed
          npm ci
          npx playwright install --with-deps chromium

      - name: Render today's story (photo or video)
        id: render
        if: steps.guard.outputs.skip != 'yes'
        env:
          ENABLE_VIDEO: '1'
        run: |
          node src/render.mjs
          # 休業日など画像が作られなかった場合は後続をスキップする
          if [ -f out/story.mp4 ]; then
            echo "post=yes" >> "$GITHUB_OUTPUT"
            echo "ext=mp4" >> "$GITHUB_OUTPUT"
          elif [ -f out/story.png ]; then
            echo "post=yes" >> "$GITHUB_OUTPUT"
            echo "ext=png" >> "$GITHUB_OUTPUT"
          else
            echo "post=no" >> "$GITHUB_OUTPUT"
          fi
          # Preserve the current posting script before switching to published.
          cp src/post.mjs "$RUNNER_TEMP/cozy-post.mjs"
          cp scripts/claim-post.sh "$RUNNER_TEMP/cozy-claim.sh"

      - name: Publish media to a public URL (immutable commit on published branch)
        id: publish
        env:
          MEDIA_EXT: ${{ steps.render.outputs.ext }}
        if: steps.render.outputs.post == 'yes'
        run: |
          OWNER_REPO="${{ github.repository }}"
          git config user.name  "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin published; then
            git fetch origin published
            git checkout -b published origin/published
          else
            git checkout -b published
          fi
          mkdir -p published
          case "$MEDIA_EXT" in png|mp4) ;; *) exit 1 ;; esac
          cp "out/story.$MEDIA_EXT" "published/story.$MEDIA_EXT"
          git add -f "published/story.$MEDIA_EXT"
          git commit -m "story image $(date -u +%FT%TZ)" || echo "no changes"
          git push origin published
          SHA=$(git rev-parse HEAD)
          if [ "$MEDIA_EXT" = mp4 ]; then
            echo "video_url=https://raw.githubusercontent.com/${OWNER_REPO}/${SHA}/published/story.mp4" >> "$GITHUB_OUTPUT"
          else
            echo "image_url=https://raw.githubusercontent.com/${OWNER_REPO}/${SHA}/published/story.png" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Instagram Stories
        if: steps.render.outputs.post == 'yes'
        env:
          POST_DATE: ${{ steps.guard.outputs.date }}
          CLAIM_SCRIPT: ${{ runner.temp }}/cozy-claim.sh
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.publish.outputs.image_url }}
          VIDEO_URL: ${{ steps.publish.outputs.video_url }}
        run: node "$RUNNER_TEMP/cozy-post.mjs"

      # 成功時に確定。publish直前のpending記録がある失敗は自動再投稿しない。
      - name: Record posted date (dup guard)
        if: steps.render.outputs.post == 'yes'
        env:
          POST_DATE: ${{ steps.guard.outputs.date }}
        run: |
          TODAY="$POST_DATE"
          git config user.name  "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          echo "$TODAY" > last_posted.txt
          rm -f pending_post.txt
          if git ls-files --error-unmatch pending_post.txt >/dev/null 2>&1; then
            git add -u -- pending_post.txt
          fi
          git add -f last_posted.txt
          if ! git diff --cached --quiet; then git commit -m "posted $TODAY"; fi
          git push origin published

      - name: Report failure in GitHub
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Instagram daily story: action required';
            const body = `投稿処理が失敗しました。実行ログ: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nInstagramとpublishedのpending_post.txtを確認してください。結果不明のまま記録を消して再実行しないでください。`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
