name: スマホ用デザイン設定
run-name: デザイン変更（${{ inputs.overlay_color }}・${{ inputs.overlay_strength }}）
on:
  workflow_dispatch:
    inputs:
      overlay_color:
        description: '写真に重ねる色（保存後、次回生成から反映）'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - 'コーヒーブラウン'
          - 'ブラック'
          - 'ネイビー'
      overlay_strength:
        description: '色の濃さ'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - '薄め'
          - 'おすすめ'
          - '濃いめ'
      accent_color:
        description: '営業時間・区切り線・CLOSED文字の色'
        type: choice
        default: '変更しない'
        options:
          - '変更しない'
          - 'ティファニーブルー'
          - 'ホワイト'
          - 'クリーム'
permissions:
  contents: write
concurrency:
  group: cozy-mobile-design-settings
  cancel-in-progress: false
jobs:
  save-design:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and update design only
        env:
          OVERLAY_COLOR: ${{ inputs.overlay_color }}
          OVERLAY_STRENGTH: ${{ inputs.overlay_strength }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          function updateDesign(html, schedule, color, strength, accent) {
            const colors = { 'コーヒーブラウン': [43,29,20], 'ブラック': [0,0,0], 'ネイビー': [18,30,46] };
            const levels = { '薄め': [0.27,0,0.22,0.13,0.34], 'おすすめ': [0.42,0,0.34,0.20,0.52], '濃いめ': [0.55,0,0.46,0.30,0.65] };
            const accents = { 'ティファニーブルー': '#0abab5', 'ホワイト': '#ffffff', 'クリーム': '#ead8b7' };
            const keep = '変更しない';
            for (const [value, choices] of [[color, colors], [strength, levels], [accent, accents]]) {
              if (value !== keep && !Object.hasOwn(choices, value)) throw new Error('選択値が不正です');
            }
            if (color !== keep || strength !== keep) {
              const blocks = html.match(/\.scrim\s*\{[^}]*\}/g);
              if (!blocks || blocks.length !== 1) throw new Error('透過幕の設定を特定できません');
              let index = 0;
              const block = blocks[0].replace(/rgba\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/g, (_,r,g,b,a) => {
                const rgb = color === keep ? [r,g,b] : colors[color];
                const alpha = strength === keep ? a : levels[strength][index];
                index++;
                return 'rgba(' + rgb.join(', ') + ', ' + alpha + ')';
              }).replace(/\/\*[\s\S]*?\*\//, '/* スマホ用デザイン設定から更新する透過幕 */');
              if (index !== 5) throw new Error('透過幕の形式が変更されています。保存を中止しました');
              html = html.replace(blocks[0], block);
            }
            if (accent !== keep) schedule.theme = { ...schedule.theme, accent: accents[accent] };
            return { html, schedule };
          }
          const original = await readFile('src/template.html', 'utf8');
          const scheduleText = await readFile('schedule.json', 'utf8');
          const result = updateDesign(original, JSON.parse(scheduleText), process.env.OVERLAY_COLOR, process.env.OVERLAY_STRENGTH, process.env.ACCENT_COLOR);
          if (result.html !== original) await writeFile('src/template.html', result.html);
          if (process.env.ACCENT_COLOR !== '変更しない') await writeFile('schedule.json', JSON.stringify(result.schedule, null, 2) + '\n');
          JS
      - name: Save settings
        run: |
          git add -- src/template.html schedule.json
          if git diff --cached --quiet; then
            echo '変更はありません。現在の設定を維持しました。' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update story design from mobile settings"
            git push origin HEAD:main
            echo 'デザインを保存しました。次回の画像生成から反映されます。' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Instagramへの投稿は実行していません。' >> "$GITHUB_STEP_SUMMARY"
          echo '[新しいデザインをプレビューする](https://github.com/56p6545md4-creator/ig-story-auto-cozy/actions/workflows/preview-story.yml)' >> "$GITHUB_STEP_SUMMARY"
